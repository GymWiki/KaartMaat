name: iOS release (.ipa voor de App Store)

# Handmatig starten: Actions > "iOS release" > Run workflow.
# Het resultaat is een .ipa die je als download (artifact) van de run haalt en
# met Transporter naar App Store Connect uploadt, of die deze actie zelf naar
# TestFlight uploadt. Zie .github/ios-release.md voor de benodigde secrets.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Buildnummer (leeg = het nummer achter de + in pubspec.yaml). Moet bij elke upload hoger zijn."
        required: false
        type: string
      upload_to_testflight:
        description: "Na het bouwen meteen naar App Store Connect (TestFlight) uploaden"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.kaartmaat.app
    steps:
      - uses: actions/checkout@v4

      - name: Controleer of de secrets er zijn
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -z "$CERT" ] && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$CERT_PASSWORD" ] && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende secrets:$missing. Zie .github/ios-release.md."
            exit 1
          fi

      # Apple eist de nieuwste Xcode (en iOS-SDK) voor uploads naar de App Store.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Certificaat en provisioning profile installeren
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # naam, UUID en team uit het profile zelf lezen
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME (team $TEAM_ID)"

      # Alleen het Runner-target krijgt handmatige signering; de Pods blijven
      # ongemoeid. Dit past alleen de kopie in deze CI-run aan.
      - name: Signering voor Runner instellen
        run: |
          perl -0pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.kaartmaat\.app;)/$1\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/g' ios/Runner.xcodeproj/project.pbxproj
          grep -c "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - run: flutter pub get

      - name: Bouwen (.ipa)
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$BUILD_NUMBER" ]; then ARGS="--build-number=$BUILD_NUMBER"; fi
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist $ARGS
          ls -la build/ios/ipa

      - name: Versie voor de bestandsnaam bepalen
        id: version
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          PLIST="$RUNNER_TEMP/ipa"
          mkdir -p "$PLIST" && unzip -q -o "$IPA" 'Payload/*.app/Info.plist' -d "$PLIST"
          INFO=$(ls "$PLIST"/Payload/*.app/Info.plist)
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          echo "name=Kaartmaat-ios-$V-build$B" >> "$GITHUB_OUTPUT"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "Versie $V, build $B"

      - name: .ipa bewaren als download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Uploaden naar App Store Connect (TestFlight)
        if: ${{ inputs.upload_to_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY" ]; then
            echo "::error::Voor uploaden zijn APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID en APP_STORE_CONNECT_API_KEY_BASE64 nodig."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Opruimen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"
